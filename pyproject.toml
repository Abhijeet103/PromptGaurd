[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptguard"
version = "0.1.0"
description = "A fast, layered prompt injection detection engine for AI and LLM systems."
authors = [
    { name = "Abhijeet Kumar Jha", email = "abhijeet@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.5.0",
    "transformers>=4.40.0",
    "torch>=2.1.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.65.0",
    "flashtext>=2.7"
]

[project.urls]
"Homepage" = "https://github.com/Abhijeet103/promptguard"
"Bug Tracker" = "https://github.com/Abhijeet103/promptguard/issues"
